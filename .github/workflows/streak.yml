name: daily-streak

on:
  schedule:
    # Runs daily at 10:00 UTC. Change this to whatever time you want
    # (crontab.guru helps). GitHub adds 5-30 min of drift, plus the
    # random delay below - one message lands every calendar day either way.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  streak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Random human-ish delay (0-15 min, skipped on manual runs)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 900))

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Send streak emojis
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
          TZ_ID: ${{ vars.TZ_ID || 'UTC' }}
        run: node streak.js
